name: Update apktool submodule

on:
  workflow_dispatch:

jobs:
  update:
    runs-on: ubuntu-latest
    permissions:
      contents: write

    steps:
      - uses: actions/checkout@v4
        with:
          submodules: recursive
          fetch-depth: 0

      - name: Update apktool submodule
        run: |
          cd external/apktool
          git fetch origin
          git checkout 136d78d0aa2b2a08034a9fa7ca87e72359febe23

      - name: Commit submodule update
        run: |
          git config user.name "github-actions"
          git config user.email "github-actions@github.com"
          git add external/apktool
          git commit -m "build(deps): pin apktool to patch-compatible commit"
          git push
