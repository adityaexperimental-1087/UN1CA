name: Set apktool to xfwdrev version

on:
  workflow_dispatch:

jobs:
  set-apktool:
    runs-on: ubuntu-latest
    permissions:
      contents: write

    steps:
      - name: Checkout repo with submodules
        uses: actions/checkout@v4
        with:
          fetch-depth: 0
          submodules: recursive

      - name: Set apktool to xfwdrev commit b55794d
        run: |
          cd external/apktool

          # Point submodule to xfwdrev fork
          git remote set-url origin https://github.com/xfwdrev/Apktool.git

          # Fetch and checkout the exact commit used by xfwdrev/UN1CA
          git fetch origin
          git checkout b55794d

      - name: Commit submodule update
        run: |
          git config user.name "github-actions"
          git config user.email "github-actions@github.com"

          git add external/apktool
          git commit -m "build(deps): align apktool with xfwdrev UN1CA (b55794d)"
          git push
