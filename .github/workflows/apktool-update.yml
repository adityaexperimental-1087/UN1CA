name: Update apktool submodule

on:
  workflow_dispatch:

jobs:
  update-apktool:
    runs-on: ubuntu-latest
    permissions:
      contents: write

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          fetch-depth: 0
          submodules: recursive

      - name: Pin apktool to patch-compatible commit
        run: |
          cd external/apktool

          echo "Current remotes:"
          git remote -v

          # Ensure upstream remote exists
          if ! git remote | grep -q upstream; then
            git remote add upstream https://github.com/iBotPeaches/Apktool.git
          fi

          # Fetch the exact commit from upstream
          git fetch upstream 136d78d0aa2b2a08034a9fa7ca87e72359febe23

          # Checkout the commit
          git checkout 136d78d0aa2b2a08034a9fa7ca87e72359febe23

      - name: Commit submodule update
        run: |
          git config user.name "github-actions"
          git config user.email "github-actions@github.com"

          git add external/apktool
          git commit -m "build(deps): pin apktool to patch-compatible commit"
          git push
