name: Set apktool to exact commit

on:
  workflow_dispatch:

jobs:
  update-apktool:
    runs-on: ubuntu-latest
    permissions:
      contents: write

    steps:
      - name: Checkout repo with submodules
        uses: actions/checkout@v6
        with:
          fetch-depth: 0
          submodules: recursive

      - name: Update apktool submodule to commit b55794d
        run: |
          cd external/apktool

          # Make sure origin is iBotPeaches repo
          git remote set-url origin https://github.com/iBotPeaches/Apktool.git

          # Fetch all refs
          git fetch origin

          # Checkout that exact commit
          git checkout b55794dea4700b17458a371a9fe7604b2b21db66

      - name: Commit submodule update
        run: |
          git config user.name "github-actions"
          git config user.email "github-actions@github.com"

          git add external/apktool
          git commit -m "chore: pin apktool to iBotPeaches Apktool@b55794d"
          git push
